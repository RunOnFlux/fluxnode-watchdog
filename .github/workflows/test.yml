name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --include=dev --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Legacy nodes run FluxOS's Node 20 and later; ArcaneOS runs Node 24.
        node-version: [20, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --include=dev --no-audit --no-fund
      - run: npm test
